name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PIP_PROGRESS_BAR: "off"
      PYTHONHASHSEED: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          
      - name: Install System Dependencies (Qt & xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 libxcb-xfixes0 libxcb-shape0 libxcb-cursor0 libglib2.0-0 libgl1 libegl1 libfontconfig1 libdbus-1-3

      - name: Install Kindred and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install ".[test]"
          # REMOVE BUILD ARTIFACTS SO PYTEST DOESN'T FIND DUPLICATES
          rm -rf build/ *.egg-info/ .eggs/

      - name: Run CI gate
        run: xvfb-run -a bash tools/audit/run_ci.sh

      - name: Dump Import Failures (if failed)
        if: failure()
        run: |
          echo "==== IMPORT SWEEP FAILURES ===="
          cat _audit_reports/*/E_import_sweep.txt || true
          echo "==== GUI AUDIT FAILURES ===="
          cat _audit_reports/*/G_gui_audit.txt || true
