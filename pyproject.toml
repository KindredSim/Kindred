[build-system]
requires = ["setuptools==75.1.0", "wheel==0.44.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kindred"
description = "Chemical kinetics simulation and fitting GUI"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Pedro Oliveira" }]
keywords = ["chemical kinetics", "kinetics", "fitting", "simulation", "gui", "chemistry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering",
]
urls = { Homepage = "https://github.com/kindredsim/kindred", Repository = "https://github.com/kindredsim/kindred" }
requires-python = ">=3.12,<3.13"
dynamic = ["version"]
dependencies = [
    "numpy==2.0.0",
    "scipy==1.13.1",
    "sympy==1.14.0",
    "PySide6==6.7.2",
    "pyqtdarktheme-fork==2.3.4",
    "pyqtgraph==0.13.7",
    "openpyxl==3.1.5",
    "ironcalc==0.8.3",
]

[project.gui-scripts]
kindred = "kindred.__main__:main"
kindred-gui = "kindred.__main__:main"

[dependency-groups]
dev = [
    "ruff==0.14.5",
    "vulture==2.14",
    "pytest==9.0.2",
    "pytest-qt==4.5.0",
]
fitting-runtime = [
    "numpy==2.5.3",
    "scipy==1.18.1",
    "sympy==1.14.0",
    "mpmath==1.3.0",
]

[tool.kindred.fitting-runtime]
python-version = "3.15.0rc2t"

[tool.setuptools]
packages = { find = { include = ["kindred*"] } }
license-files = [
    "LICENSE",
    "NOTICE.txt",
    "THIRD_PARTY_LICENSES.txt",
    "COPYING",
    "COPYING.LESSER",
]

[tool.setuptools.dynamic]
version = { attr = "kindred._version.__version__" }

[tool.setuptools.package-data]
kindred = ["data/**/*"]
