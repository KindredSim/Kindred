[pytest]
addopts = --strict-markers --strict-config
norecursedirs = _audit_reports build
markers =
    unit: Fast-running tests covering small units of logic.
    integration: Tests that exercise multiple components together or rely on external resources.
    gui: Tests that instantiate Qt/PySide6 widgets or exercise GUI behavior.
    slow: Tests identified as long-running during profiling.
    experimental: Tests for experimental features such as ROS-native solvers or stress scenarios.
